[package]
name = "clipman"
version = "0.1.0"
edition = "2024"
description = "A fast, lightweight clipboard manager for Linux (optimized for GNOME & Ubuntu)"
repository = "https://github.com/dsnbyte/clipman"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
async-channel = "2"
env_logger = "0.11.11"
gpui = { version = "0.2.2", default-features = false, features = ["x11", "font-kit"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
x11rb = { version = "0.13", features = ["xfixes"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
